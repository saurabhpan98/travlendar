        <div class="container pb-5 mb-5">
            <h2 class="mt-5 mb-3">New event</h2>
            <form id = "event_form">
                <input type="text" class="text-center form-control mb-3" placeholder="Event name" name="event_name" id="event_name" required />
                <div class="row mt-3">
                    <div class="col-lg-5">
                        <div class="form-row my-2">
                            <div class="col-lg-3 my-2"><label class="col-form-label">From</label></div>
                            <div class="col-lg-5"><input class="form-control my-2" type="date" name = "from_date" required /></div>
                            <div class="col-lg-4 my-2"><input class="form-control" type="time" name = "from_time" required /></div>
                        </div>
                        <div class="form-row">
                            <div class="col-lg-3 my-2"><label class="col-form-label">Until</label></div>
                            <div class="col-lg-5 my-2"><input class="form-control" type="date" name = "until_date" required /></div>
                            <div class="col-lg-4 my-2"><input class="form-control" type="time" name = "until_time" required /></div>
                        </div>
                        <div class="form-row my-3">
                            <div class="col-lg-3 my-2"><label class="col-form-label">Event</label></div>
                            <div class="col-lg-9 d-flex my-2"><i class="material-icons mt-2 mr-2 text-danger">place</i><input class="form-control" type="text" placeholder="Event location" name="event_location" id="event_location" required /></div>
                        </div>
                        <div class="form-row my-3">
                            <div class="col-lg-3 my-2"><label class="col-form-label">Start</label></div>
                            <div class="col-lg-9 d-flex my-2"><i class="material-icons mt-2 mr-2 text-primary">my_location</i><input class="form-control" type="text" placeholder="Start location" name="start_location" id="start_location" required /></div>
                        </div>
                        <div class="form-row">
                            <div class="col-lg-3 my-2"><label class="col-form-label">Departure&nbsp;</label></div>
                            <div class="col-lg-5 my-2"><input class="form-control" type="date" name = "departure_date"></div>
                            <div class="col-lg-4 my-2"><input class="form-control" type="time" name = "departure_time"></div>
                        </div>
                        <button class="btn btn-outline-primary btn-block mt-3" type="button" data-target="#mode_modal" data-toggle="modal">Choose transportation mode</button>
                        
                    </div>
                    <div class="col-lg-7" id="map">
                        
                    </div>
                </div>
                <textarea class="form-control my-4 text-center" name="note" placeholder="Add extra note (optional)" id="extra_note"></textarea>
                <button class="btn btn-primary float-right" type="submit" id="event_submit">Save event</button>
                <a href="profile.html" class="btn btn-outline-danger float-right mr-3" type="button">Cancel</a>
            </form>
            
            <div class="modal fade" role="dialog" tabindex="-1" id="mode_modal" aria-labelledby="modeModalLabel" aria-hidden="true">
                <div class="modal-dialog" role="document">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h4 class="modal-title">Select your transportation mode</h4><button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">×</span></button>
                        </div>
                        <form id = "transportation_mode_form">
                            <div class="modal-body">
                                <div class="form-row">
                                    <div class="col-lg-3 text-center"><i class="material-icons d-block">train</i><span class="d-block border border rounded">3 hours 2 mins, 5 km</span><input type="radio" class="mt-3" name="mode" value = "train"></div>
                                    <div class="col-lg-3 text-center"><i class="material-icons d-block">directions_car</i><span class="d-block border border rounded">2 hours, 3 km</span><input type="radio" class="mt-3" name="mode" value = "car"></div>
                                    <div class="col-lg-3 text-center"><i class="material-icons d-block">motorcycle</i><span class="d-block border border rounded">3 hours, 4 km</span><input type="radio" class="mt-3" name="mode" value = "bike"></div>
                                    <div class="col-lg-3 text-center"><i class="material-icons d-block">directions_walk</i><span class="d-block border border rounded">7 hours 4 mins, 8 km</span><input type="radio" class="mt-3" name="mode" value = "walking"></div>
                                </div>    
                            </div>
                            <div class="modal-footer"><button class="btn btn-primary btn-block" type="button" data-dismiss="modal">Save mode</button></div>
                        </form>
                    </div>
                </div>
            </div>

        <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD4-QOWTvatTe_46i2XOI6tXUIx40hHVQY&libraries=places&callback=initMap" async defer></script>
        <script>
            function initMap(){
                var map = new google.maps.Map(document.getElementById('map'), {
                    center: {lat: 28.7041, lng: 77.1025},
                    zoom: 11
                });

                var input = document.getElementById('event_location');
                var autocomplete = new google.maps.places.Autocomplete(input);
                autocomplete.setFields(
                    ['address_components', 'geometry', 'name']);

                autocomplete.addListener('place_changed', function(){
                    var place = autocomplete.getPlace();
                    if(!place.geometry){
                        window.alert("No details available for input: " + place.name);
                        return; 
                    }
                })
            }
        </script>
