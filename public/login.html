<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="assets/css/Navigation-Clean.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <nav class="navbar navbar-light navbar-expand-md shadow-sm">
        <div class="container-fluid"><a class="navbar-brand" href="/">Travlendar</a><button data-toggle="collapse" class="navbar-toggler" data-target="#navcol-1"><span class="sr-only">Toggle navigation</span><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse"
                id="navcol-1">
                <ul class="nav navbar-nav ml-auto">
                    <li class="nav-item px-2" role="presentation" href="#"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item px-2" role="presentation"><a class="nav-link" href="/about">About</a></li>
                    <li class="nav-item px-2" role="presentation"><a class="nav-link" href="/team">Team</a></li>
                    <li class="nav-item px-2" role="presentation" id="login"><a class="nav-link active" href="/login">Login</a></li>
                    <li class="nav-item px-2" role="presentation" id="signup"><a class="nav-link" href="/signup">Signup</a></li>
                    <li class="nav-item px-2" role="presentation" id="profile"><a class="nav-link" href="/profile">Profile</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <form class="px-3 login-form" id ="login-form" method="POST" onsubmit ="submitForm()" >
            <h1 class="text-center mt-5">Login</h1>
            <h5 class="mb-5 text-center">Travlendar</h5>
            <div class="alert-box mb-2" id="alert-box">

            </div>
            <label>Your email</label>
            <input class="form-control mb-4" type="text" name="username" placeholder="Your email" required>
            <label>Your passsword</label>
            <input class="form-control mb-5" type="password" placeholder="Your password" name="password" required>
            <button class="btn btn-primary btn-block" type="submit" id="submit">Login</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
    <script src="/scripts/check-login.js"></script>
    <script src = "/scripts/login-script.js"></script>
